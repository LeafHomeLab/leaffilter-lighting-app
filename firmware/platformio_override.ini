# ─── LeafFilter WLED — spike build environment ───────────────────────────────
# Copy this file to the ROOT of your WLED checkout (next to platformio.ini),
# then:  pio run -e lf_spike -t upload
# See firmware/README.md for the full procedure.

[env:lf_spike]
extends = env:esp32dev
board_build.partitions = ${esp32.default_partitions}

lib_deps = ${env:esp32dev.lib_deps}
  h2zero/NimBLE-Arduino@^1.4.2
  knolleary/PubSubClient@^2.8

build_flags = ${env:esp32dev.build_flags}
  ; ── LeafFilter usermods ──
  -D USERMOD_LF_BLE_PROVISIONING
  -D USERMOD_LF_CLOUD_AGENT
  ; Spike TLS mode: full handshake, no cert validation (see cloud agent header).
  ; Set to 0 and paste dev certs for the AWS IoT mutual-TLS variant.
  -D LF_SPIKE_INSECURE=1
  -D LF_MQTT_HOST='"test.mosquitto.org"'
  -D LF_MQTT_PORT=8883
  ; ── Free flash + RAM for BLE & TLS: drop integrations the product ────────
  ; ── doesn't use. Native MQTT must be off (our agent replaces it). ────────
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_ESPNOW
  ; Serial heap telemetry needs debug prints
  -D WLED_DEBUG

# If the app partition overflows (BLE + TLS add ~600 kB flash), switch to a
# larger-app partition table, e.g.:
#   board_build.partitions = tools/WLED_ESP32_4MB_256KB_FS.csv
# (config + presets fit comfortably in 256 kB FS for this product.)
